# espanso configuration file
#
# yaml-language-server: $schema=https://raw.githubusercontent.com/espanso/espanso/dev/schemas/config.schema.json
#
# Deployed read-only via modules/apps/cli/espanso/default.nix (Home Manager
# xdg.configFile) -- edit this file and rebuild, don't hand-edit the deployed
# symlink. See https://espanso.org/docs/ for the full option reference.

# --- Toggle key

# Customize the key used to disable and enable espanso (when double tapped)
# Available options: CTRL, SHIFT, ALT, CMD, OFF
# toggle_key: ALT

# --- Injection Backend

# "Auto" (default) works well in most cases. On Wayland/Hyprland, Clipboard
# is the more reliable fallback if Auto misbehaves in a given app.
# backend: Clipboard

# --- Auto-restart

# auto_restart: false

# --- Clipboard threshold

# Because injecting long texts char-by-char is a slow operation, espanso
# automatically uses the clipboard if the text is longer than this many
# characters.
# clipboard_threshold: 100

# --- Regex Buffer Size

# max_regex_buffer_size: 30
